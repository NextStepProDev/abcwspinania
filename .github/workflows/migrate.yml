name: Migrate

# Schema migrations on the production database. Since 13.10.2026 the Deploy
# workflow runs them ITSELF (through `workflow_call`), before swapping the app —
# this button stays for running migrations without deploying.
#
# Until 13.10.2026 this was only a separate button, so that a schema change
# would be a decision and not a side effect of deploying. But Deploy is manual
# too, so deploying already is the decision — and the second button could be
# skipped: on 13.10.2026 0.7.0 went out without migrations and the panel failed
# on `relation "broadcasts" does not exist`.
#
# WHY AN SSH TUNNEL, and not `docker compose run` on the server:
# the production image is `output: standalone` and weighs ~80 MB, because
# Turbopack bundled the dependencies into server chunks — it has neither
# Payload's CLI nor its modules. A second image with a full node_modules would
# weigh ~1 GB for every version, and a full disk is exactly what once took the
# deploy down in anovastudio. Instead the runner, which has every dependency
# anyway, runs the migrations through a tunnel to a database exposed ONLY on
# the server's loopback.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "migrate" to confirm changing the production database schema
        required: true
        default: ''
  # Called by Deploy. Secrets come through `secrets: inherit`, and the code
  # from the same commit as the calling Deploy — the one Deploy reads VERSION
  # from.
  workflow_call:
    inputs:
      confirm:
        type: string
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'migrate'
        run: |
          echo "ERROR: not confirmed. Type exactly: migrate" >&2
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      - name: Open SSH tunnel to the production database
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # -f in the background, -N without a remote command. The database
          # listens on the server on 127.0.0.1:5432 only (see
          # deploy/docker-compose.prod.yml).
          ssh -f -N -L 55432:127.0.0.1:5432 \
            -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          # Wait until the local port actually accepts connections.
          # `_` instead of `i` — the loop variable is unused here, which
          # would rightly be reported by shellcheck (SC2034).
          for _ in $(seq 1 15); do
            if nc -z 127.0.0.1 55432; then echo "tunnel ready"; exit 0; fi
            sleep 2
          done
          echo "ERROR: the tunnel did not come up within 30 s." >&2
          exit 1

      # ⚠️ GATE BEFORE A HANG. `payload migrate` asks an INTERACTIVE QUESTION
      # when `payload_migrations` holds a `dev` entry (left by `push` mode,
      # i.e. `npm run dev`):
      #   "It looks like you've run Payload in dev mode... data loss will occur.
      #    Would you like to proceed? (y/N)"
      # Measured 19.09.2026: without a terminal that question HANGS, even with
      # stdin closed (`< /dev/null`) — the job would sit until the timeout and
      # fail with a message that says nothing.
      #
      # Production has `push: false`, so a `dev` entry should never be there.
      # If it is, someone ran the app in development mode against the client's
      # database — and then we want to STOP with a clear message, not answer
      # "yes" to a question about losing data.
      - name: Gate — the database is not in "dev" state
        env:
          DATABASE_URI: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:55432/${{ secrets.POSTGRES_DB }}
        run: |
          node --input-type=module -e "
            import pg from 'pg'
            const c = new pg.Client({ connectionString: process.env.DATABASE_URI })
            await c.connect()
            const { rows } = await c.query(
              \"select 1 from payload_migrations where name = 'dev' limit 1\"
            ).catch(() => ({ rows: [] }))
            await c.end()
            if (rows.length) {
              console.error('STOPPING: the production database has a \'dev\' migration entry.')
              console.error('Someone ran the app in development mode (push) against this database.')
              console.error('Payload would ask here for consent to LOSING DATA. Resolve it by hand.')
              process.exit(1)
            }
            console.log('OK: no \'dev\' entry, migrations can run without a question.')
          "

      - name: Apply migrations
        env:
          DATABASE_URI: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:55432/${{ secrets.POSTGRES_DB }}
          # Payload needs the secret to start, though migrations do not use it.
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        # `timeout` as the second line of defence: if something asked despite
        # the gate, the job fails after 5 minutes instead of sitting until the limit.
        run: timeout 300 npm run migrate < /dev/null

      - name: Close the tunnel
        if: always()
        run: pkill -f "ssh -f -N -L 55432" || true
