name: Migrate

# ŚWIADOMIE OSOBNY, RĘCZNY WORKFLOW — nie część deployu.
#
# Zmiana schematu w bazie z danymi klienta ma być decyzją, a nie skutkiem
# ubocznym wdrożenia. Kolejność przy zmianie modelu treści:
#   1. `npm run migrate:create <nazwa>` lokalnie, migracja trafia do repo
#   2. merge do main → CI buduje obraz
#   3. TEN workflow → migracja na produkcji
#   4. workflow „Deploy" → nowy obraz
#
# DLACZEGO TUNEL SSH, a nie `docker compose run` na serwerze:
# obraz produkcyjny to `output: standalone` i waży ~80 MB, bo Turbopack wbudował
# zależności w chunki serwera — nie ma w nim ani CLI Payloada, ani jego modułów.
# Drugi obraz z pełnym node_modules ważyłby ~1 GB przy każdej wersji, a zapchany
# dysk to dokładnie to, co kiedyś położyło deploy w anovastudio. Zamiast tego
# migracje odpala runner, który i tak ma komplet zależności, przez tunel do bazy
# wystawionej WYŁĄCZNIE na pętli zwrotnej serwera.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Wpisz "migruj", żeby potwierdzić zmianę schematu bazy produkcyjnej
        required: true
        default: ''

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Sprawdź potwierdzenie
        if: inputs.confirm != 'migruj'
        run: |
          echo "BŁĄD: nie potwierdzono. Wpisz dokładnie: migruj" >&2
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      - name: Otwórz tunel SSH do bazy produkcyjnej
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # -f w tle, -N bez zdalnego polecenia. Baza słucha na serwerze tylko
          # na 127.0.0.1:5432 (patrz deploy/docker-compose.prod.yml).
          ssh -f -N -L 55432:127.0.0.1:5432 \
            -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          # Poczekaj, aż port lokalny faktycznie przyjmuje połączenia.
          # `_` zamiast `i` — zmienna pętli jest tu nieużywana, a shellcheck
          # słusznie to zgłasza (SC2034).
          for _ in $(seq 1 15); do
            if nc -z 127.0.0.1 55432; then echo "tunel gotowy"; exit 0; fi
            sleep 2
          done
          echo "BŁĄD: tunel nie wstał w 30 s." >&2
          exit 1

      # ⚠️ BRAMKA PRZED ZAWIESZENIEM. `payload migrate` zadaje PYTANIE INTERAKTYWNE,
      # jeśli w tabeli `payload_migrations` jest wpis `dev` (zostawia go tryb
      # `push`, czyli `npm run dev`):
      #   "It looks like you've run Payload in dev mode... data loss will occur.
      #    Would you like to proceed? (y/N)"
      # Zmierzone 19.09.2026: bez terminala to pytanie WISI, i to nawet przy
      # zamkniętym stdin (`< /dev/null`) — job stałby do timeoutu i padł
      # z komunikatem, z którego nic nie wynika.
      #
      # Produkcja ma `push: false`, więc wpisu `dev` nie powinno tam być nigdy.
      # Jeśli jednak jest, znaczy to, że ktoś uruchomił aplikację w trybie
      # deweloperskim przeciw bazie klienta — i wtedy chcemy ZATRZYMAĆ się
      # z jasnym komunikatem, a nie odpowiedzieć „tak" na pytanie o utratę danych.
      - name: Bramka — czy baza nie jest w stanie „dev"
        env:
          DATABASE_URI: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:55432/${{ secrets.POSTGRES_DB }}
        run: |
          node --input-type=module -e "
            import pg from 'pg'
            const c = new pg.Client({ connectionString: process.env.DATABASE_URI })
            await c.connect()
            const { rows } = await c.query(
              \"select 1 from payload_migrations where name = 'dev' limit 1\"
            ).catch(() => ({ rows: [] }))
            await c.end()
            if (rows.length) {
              console.error('PRZERYWAM: baza produkcyjna ma wpis migracji \'dev\'.')
              console.error('Ktoś uruchomił aplikację w trybie deweloperskim (push) przeciw tej bazie.')
              console.error('Payload zapytałby tu o zgodę na UTRATĘ DANYCH. Rozwiąż to ręcznie.')
              process.exit(1)
            }
            console.log('OK: brak wpisu \'dev\', migracje mogą iść bez pytania.')
          "

      - name: Zastosuj migracje
        env:
          DATABASE_URI: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:55432/${{ secrets.POSTGRES_DB }}
          # Payload wymaga sekretu przy starcie, choć migracje go nie używają.
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        # `timeout` jako druga linia obrony: gdyby mimo bramki coś zapytało,
        # job pada po 5 minutach zamiast stać do limitu.
        run: timeout 300 npm run migrate < /dev/null

      - name: Zamknij tunel
        if: always()
        run: pkill -f "ssh -f -N -L 55432" || true
