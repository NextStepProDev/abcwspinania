name: CI

on:
  push:
    branches: [main]
    paths:
      - web/**
      - VERSION
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - web/**
      - VERSION
      - .github/workflows/ci.yml

# Cancel outdated PR runs, but NEVER a run on main: every push may bump
# VERSION, and its docker job must build and push that image — otherwise
# deploy pulls a tag that does not exist. Pushes to main queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  lint-typecheck-build:
    # Architecture does not matter here — x86 runners are cheaper and quicker to get.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # NOT A SECRET. Payload refuses to start without PAYLOAD_SECRET (see
      # requireSecret in web/src/payload.config.ts), and type generation and
      # the build must load the config. None of these steps issues session
      # tokens or touches a database, so the value does not matter — what
      # matters is that the REAL secret never has to come here.
      PAYLOAD_SECRET: not-a-secret-just-a-ci-placeholder
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # MUST match `FROM node:<version>-alpine` in web/Dockerfile.
          # Dependabot bumps only there (the docker ecosystem reads Dockerfiles);
          # nobody touches this number. On the next major change BOTH places.
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # BLOCKING. `--omit=dev` is the point here, not a narrowing: the
      # production image is `output: standalone`, so only production
      # dependencies reach it. Without the flag the audit reports
      # vulnerabilities in development tools (drizzle-kit, eslint) that never
      # leave CI — and the gate would need `continue-on-error`, i.e. guard nothing.
      # `npm run audit` = `npm audit --omit=dev` + high/critical + a list of
      # exceptions by id, each with its reason (web/scripts/audit-gate.mjs).
      - name: npm audit (production, high+)
        run: npm run audit
      # Payload's types are generated from the collection config and COMMITTED.
      # This step keeps them in step with the config: if someone changed a
      # field and did not regenerate the types, `git diff` catches it here,
      # not on production.
      - name: Payload types are up to date
        run: |
          npm run generate:types
          if ! git diff --quiet -- src/payload-types.ts; then
            echo "ERROR: src/payload-types.ts does not match the collection config."
            echo "Run 'npm run generate:types' and add the changed file to the commit."
            git diff -- src/payload-types.ts
            exit 1
          fi
      - run: npm run lint
      # Formatting is mechanical, so there is nothing to discuss in review.
      # `--check` changes no files, it only points at the drift.
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm test
      # The build deliberately runs WITHOUT a database — src/lib/content.ts
      # catches the connection error and renders empty. If that stopped
      # working, the build would fail here, not while building the image on
      # the ARM runner.
      - run: npm run build

  # Integration tests (web/tests/integration): a real Postgres and a running
  # server — API permissions, bookings, newsletter, broadcasts. The database
  # is built ONLY from the migrations in the repo, so this job also checks
  # that migrations give a complete schema (not just what `push` mode added
  # locally). The server is `.next/standalone/server.js` — the one the image
  # starts. No BREVO_API_KEY: Payload writes emails to the console, and the
  # tests swap sending for an in-memory inbox anyway. Nothing leaves from here.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # As in the job above — the value does not matter, it is not a secret.
      PAYLOAD_SECRET: not-a-secret-just-a-ci-placeholder
      DATABASE_URI: postgresql://ci:ci@127.0.0.1:5432/ci
      TEST_BASE_URL: http://127.0.0.1:3000
      # One uploads directory for the tests and the server: standalone
      # server.js changes into .next/standalone, so `process.cwd()/uploads`
      # would be two directories and a file a test uploads would be missing
      # for the server. In the image both are /app/uploads.
      UPLOAD_DIR: ${{ github.workspace }}/web/uploads
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # MUST match `FROM node:<version>-alpine` in web/Dockerfile.
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # `< /dev/null` and `timeout`: Payload's interactive question would hang
      # forever (CLAUDE.md, "Tryb push blokuje migracje").
      - name: Schema from migrations
        run: timeout 300 npm run migrate < /dev/null
      - run: npm run build
      - name: Start the server
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > server.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf -o /dev/null "$TEST_BASE_URL/api/users/me" && exit 0
            sleep 2
          done
          echo "The server did not come up within 2 minutes:"; cat server.log; exit 1
      - run: npm run test:integration
      - name: Server log
        if: failure()
        run: tail -n 200 server.log

  docker:
    needs: [lint-typecheck-build, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # ⚠️ ARM RUNNER. Production runs on Oracle Ampere A1, i.e. aarch64. An
    # image built on plain ubuntu-latest is amd64 and starts there with
    # "exec format error" — visible only on the server, after the deploy.
    # A native ARM runner is many times faster than QEMU emulation.
    # If ARM runners were unavailable for this repo: go back to ubuntu-latest,
    # add `uses: docker/setup-qemu-action@v3` before buildx and keep
    # `platforms: linux/arm64` — it works, only much slower.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      # An OCI reference must be lowercase, and the account owner's name has
      # capitals. metadata-action copes by itself, but Trivy gets the name
      # directly — we compute it once instead of hard-coding it.
      - name: Lowercase owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/abcwspinania
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: web
          platforms: linux/arm64
          # SITE_URL is the repository variable with the TARGET domain — also
          # while the site temporarily runs under another (see "Domena
          # tymczasowa" in CLAUDE.md); it bakes in the base URL for the
          # sitemap, robots and canonical URLs.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'http://localhost:3000' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # CVE scan of the image's OS layer — npm audit cannot see it.
      # Informational for now (exit-code 0 does not block the deploy).
      # `ignore-unfixed` cuts the noise of vulnerabilities without a patch. Once
      # the results are clean, set exit-code to 1 so high/critical fail the build.
      - name: Trivy image scan (high+)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.lc }}/abcwspinania:${{ steps.version.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # ⚠️ WITHOUT THIS THE STEP FAILS. By default Trivy looks for a
          # linux/amd64 variant in the image index, and we publish ONLY arm64
          # (production is Oracle Ampere). It ends in a fatal error:
          #   "no child with platform linux/amd64 in index ..."
          # `exit-code: 0` does not soften it — it is a tool failure, not a finding.
          TRIVY_PLATFORM: linux/arm64
