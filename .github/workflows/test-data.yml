name: Test data

# Data for the manual tests ON PRODUCTION (docs/testy-reczne.html), since
# 13.10.2026. A manual workflow, like Migrate — and through the same SSH
# tunnel to the database, for the same reason: the production image has
# neither the scripts nor Payload's CLI.
#
#   seed       — removes the previous test data and creates it afresh
#   clean      — removes it only; lists (ids only) what appeared WITHOUT the tag
#   clean-all  — also removes what appeared without the tag since testing began
#
# The repository is PUBLIC, so this job's logs are public too. The tester's
# inbox and the test accounts' password are therefore secrets (TEST_INBOX,
# TEST_PASSWORD), and the script prints no address, no token and no personal
# data — only ids. It creates NO panel account on production (a known password
# to the school's panel). Details: the header of web/scripts/test-data/courses.ts.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [seed, clean, clean-all]
        default: seed
      confirm:
        description: Type "test-data" to confirm changing data on production
        required: true
        default: ''

# Two runs at once would delete each other's data halfway through.
concurrency:
  group: test-data
  cancel-in-progress: false

jobs:
  test-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'test-data'
        run: |
          echo "ERROR: not confirmed. Type exactly: test-data" >&2
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      - name: Open SSH tunnel to the production database
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # As in Migrate: the database listens on the server on 127.0.0.1:5432 only.
          ssh -f -N -L 55432:127.0.0.1:5432 \
            -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          for _ in $(seq 1 15); do
            if nc -z 127.0.0.1 55432; then echo "tunnel ready"; exit 0; fi
            sleep 2
          done
          echo "ERROR: the tunnel did not come up within 30 s." >&2
          exit 1

      - name: Test data — ${{ inputs.action }}
        env:
          DATABASE_URI: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:55432/${{ secrets.POSTGRES_DB }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          # production = Payload without `push` mode: with any other NODE_ENV,
          # starting Payload would rewrite the production schema and leave the
          # `dev` entry that Migrate then stops on.
          NODE_ENV: production
          TEST_DATA_ON_PRODUCTION: 'yes'
          TEST_INBOX: ${{ secrets.TEST_INBOX }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          # Only for the course link in the summary.
          PUBLIC_URL: ${{ vars.SMOKE_URL || vars.SITE_URL }}
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in
            seed) ARG="" ;;
            clean) ARG="clean" ;;
            clean-all) ARG="clean-all" ;;
            *) echo "ERROR: unknown action $ACTION" >&2; exit 1 ;;
          esac
          # shellcheck disable=SC2086 # an empty ARG must vanish, not be an empty word
          timeout 300 npm run seed:test -- $ARG < /dev/null

      - name: Close the tunnel
        if: always()
        run: pkill -f "ssh -f -N -L 55432" || true
