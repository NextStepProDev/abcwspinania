name: Deploy

# Manual only. Deploying to the client's machine must not happen by itself on
# every merge — it is a decision, not a side effect.
#
# Three jobs, in this order (since 13.10.2026):
#   1. prepare — config to the server and `pull` of the NEW image, no swap yet.
#      Pull goes before the migration, because a migration without the image
#      (Deploy clicked before CI built it) would leave a new schema under the
#      old app. This only protects with a BUMPED `VERSION`: without a bump the
#      pull finds the old image under the same tag. The job ends by starting
#      the database alone.
#   2. migrate — the "Migrate" workflow (migrate.yml), from the same commit.
#      If it fails, `release` does not run and the old version keeps running.
#   3. release — `up -d`, nginx reload, health, smoke test.
#
# With an explicit version (e.g. going back to an older one) migrations are
# SKIPPED: the code of this commit need not match the chosen image. Down
# migrations never run by themselves — after going back the database stays on
# the newer schema (CLAUDE.md, "Migracje schematu").
on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional image tag (e.g. main, sha-abc1234). Empty = the version from the VERSION file.
        required: false
        default: ''

# The job token reads the repository and nothing else (audit, 25.10.2026):
# the image is pulled on the server without it, and a workflow with no
# `permissions` gets whatever the repository default allows.
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve deploy version
        id: version
        # Through the environment, not `${{ }}` in the script: an expression is
        # pasted into the shell before it runs, so a quote or `$(…)` typed in
        # the field would run as code — here and, through the output, in the
        # script on the server. The format check stops it before either.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # One source of truth: the VERSION file in the repo. The input field
          # overrides it only for one-off deploys (e.g. a specific sha- tag).
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ -f VERSION ]; then
            VERSION=$(cat VERSION)
          else
            echo "ERROR: no input field and no VERSION file." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "ERROR: not an image tag: letters, digits, dot, dash, underscore only." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"
          if [ -n "$INPUT_VERSION" ]; then
            echo "Version given by hand — migrations SKIPPED. Needed? The Migrate workflow."
          fi

      - name: Encode config files
        id: cfg
        run: |
          {
            echo "compose=$(base64 -w 0 deploy/docker-compose.prod.yml)"
            echo "nginx=$(base64 -w 0 deploy/nginx.conf)"
            echo "swap=$(base64 -w 0 deploy/setup-swap.sh)"
            echo "backup=$(base64 -w 0 deploy/abc-backup.sh)"
            echo "backuplog=$(base64 -w 0 deploy/abc-backup.logrotate)"
            echo "backupsetup=$(base64 -w 0 deploy/setup-backups.sh)"
            echo "fw=$(base64 -w 0 deploy/origin-firewall.sh)"
            echo "fwunit=$(base64 -w 0 deploy/origin-firewall.service)"
            echo "fwsetup=$(base64 -w 0 deploy/setup-origin-firewall.sh)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload config and pull image
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          COMPOSE_B64: ${{ steps.cfg.outputs.compose }}
          NGINX_B64: ${{ steps.cfg.outputs.nginx }}
          SWAP_B64: ${{ steps.cfg.outputs.swap }}
          BACKUP_B64: ${{ steps.cfg.outputs.backup }}
          BACKUPLOG_B64: ${{ steps.cfg.outputs.backuplog }}
          BACKUPSETUP_B64: ${{ steps.cfg.outputs.backupsetup }}
          FW_B64: ${{ steps.cfg.outputs.fw }}
          FWUNIT_B64: ${{ steps.cfg.outputs.fwunit }}
          FWSETUP_B64: ${{ steps.cfg.outputs.fwsetup }}
          VERSION: ${{ steps.version.outputs.version }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_OWNER: ${{ secrets.GHCR_OWNER }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: COMPOSE_B64,NGINX_B64,SWAP_B64,BACKUP_B64,BACKUPLOG_B64,BACKUPSETUP_B64,FW_B64,FWUNIT_B64,FWSETUP_B64,VERSION,DEPLOY_PATH,GHCR_OWNER
          script: |
            # Stop (red deploy) at the FIRST error — e.g. when `docker compose
            # pull` hits a tag that does not exist. Without it the script went
            # on, left the old containers and reported success.
            set -euo pipefail
            echo "$COMPOSE_B64" | base64 -d > "$DEPLOY_PATH/docker-compose.prod.yml"
            echo "$NGINX_B64"   | base64 -d > "$DEPLOY_PATH/nginx.conf"
            # Swap must exist before the containers start (idempotent script).
            echo "$SWAP_B64"    | base64 -d > "$DEPLOY_PATH/setup-swap.sh"
            sudo -n bash "$DEPLOY_PATH/setup-swap.sh" || echo "WARNING: swap setup skipped (check passwordless sudo)"
            # Backups: the script, the schedule and log rotation go out with
            # every deploy (deploy/RESTORE.md). Idempotent; secrets untouched.
            # A failure here does not block the site deploy — but it shows in
            # the job log.
            mkdir -p "$DEPLOY_PATH/backup"
            echo "$BACKUP_B64"      | base64 -d > "$DEPLOY_PATH/backup/abc-backup.sh"
            echo "$BACKUPLOG_B64"   | base64 -d > "$DEPLOY_PATH/backup/abc-backup.logrotate"
            echo "$BACKUPSETUP_B64" | base64 -d > "$DEPLOY_PATH/backup/setup-backups.sh"
            sudo -n bash "$DEPLOY_PATH/backup/setup-backups.sh" "$DEPLOY_PATH/backup" \
              || echo "WARNING: installing backups failed — see the log above"
            # Ports 80/443 answer Cloudflare only (deploy/origin-firewall.sh).
            # The ranges come from the nginx.conf written above. On failure
            # the previous rules (or none) stay — the site keeps working.
            mkdir -p "$DEPLOY_PATH/firewall"
            echo "$FW_B64"      | base64 -d > "$DEPLOY_PATH/firewall/origin-firewall.sh"
            echo "$FWUNIT_B64"  | base64 -d > "$DEPLOY_PATH/firewall/origin-firewall.service"
            echo "$FWSETUP_B64" | base64 -d > "$DEPLOY_PATH/firewall/setup-origin-firewall.sh"
            sudo -n bash "$DEPLOY_PATH/firewall/setup-origin-firewall.sh" "$DEPLOY_PATH/firewall" "$DEPLOY_PATH/nginx.conf" \
              || echo "WARNING: origin firewall not applied — see the log above"
            cd "$DEPLOY_PATH"

            # ⚠️ CLEANUP MUST GO BEFORE THE PULL. New images do not fit on the
            # disk next to all the previous ones, and a pull stopped by a full
            # disk ends the deploy red — exactly how anovastudio failed, with
            # the disk 99% full of 58 unused images.
            # No `docker image prune -af --filter until=...` here: with the
            # containerd store the filter lets TAGGED images through, and every
            # version since the start of the project piled up. We delete
            # explicitly, by tag: images held by containers stay, plus the KEEP
            # newest of each repository — enough for a manual rollback without
            # GHCR.
            # Counted by image ID, not by row (since 31.10.2026, after
            # anovastudio #104): one image can carry two tags (`main` and the
            # version number after a deploy by `main` or `sha-…`), and as rows
            # they took both places — the rollback version got deleted. Every
            # tag of the third and older DISTINCT images goes. `<none>` rows are
            # skipped before ranking, so the rule does not depend on the
            # `dangling=false` filter. Images in use are matched by ID too: by
            # name, an image whose tag a later deploy took over stopped being
            # protected.
            # `|| true` / `|| echo` at the end of every pipeline — with
            # `set -euo pipefail` an empty result, a failed `docker images` or
            # `docker rmi` would otherwise kill the deploy.
            KEEP=2
            IN_USE=$(docker ps -aq | xargs -r docker inspect --format '{{.Image}}' \
              | sed 's/^sha256://' | cut -c1-12 | tr '\n' ' ' || true)
            for REPO in abcwspinania; do
              docker images "ghcr.io/${GHCR_OWNER}/${REPO}" \
                --filter 'dangling=false' \
                --format '{{.CreatedAt}}\t{{.ID}} {{.Repository}}:{{.Tag}}' \
                | sort -r | cut -f2 \
                | awk -v keep="$KEEP" -v used="$IN_USE" '
                    BEGIN { n = split(used, u, " "); for (i = 1; i <= n; i++) inuse[u[i]] = 1 }
                    $2 ~ /:<none>$/ { next }
                    !($1 in rank) { rank[$1] = ++k }
                    rank[$1] > keep && !($1 in inuse) { print $2 }' \
                | while read -r IMG; do
                    echo "cleanup: removing $IMG"
                    docker rmi "$IMG" || true
                  done || echo "WARN: image cleanup for ${REPO} failed — deploy continues"
            done
            # Layers orphaned by the removed tags (this variant, without a filter, works).
            docker image prune -f || true
            df -h / | tail -1

            # The tag from the VARIABLE, not from .env: a shell variable wins
            # over .env, and .env gets the new version only in `release`, after
            # the migration. If the migration fails, a manual `up -d` still
            # starts the old version.
            VERSION="$VERSION" docker compose -f docker-compose.prod.yml pull
            # The migration goes through a tunnel to the database, so the
            # database must be running before `migrate`. On a new server (first
            # run, RESTORE.md section 8) nothing runs — without this line the
            # migration would fail, and with it `release`, which is what starts
            # the containers. On a running server it does nothing — unless the
            # new compose changed the database service or the pull brought a
            # newer `postgres:18-alpine` (floating tag, patches): then the
            # database restarts here (a few seconds) rather than in `release`.
            # It does not touch the app (the app depends on the database, not
            # the other way round).
            docker compose -f docker-compose.prod.yml up -d --wait postgres

  migrate:
    needs: prepare
    if: inputs.version == ''
    uses: ./.github/workflows/migrate.yml
    with:
      confirm: migrate
    secrets: inherit

  release:
    needs: [prepare, migrate]
    # `!cancelled()`, because a skipped `migrate` (version given by hand)
    # would otherwise skip this job too. A failed migration still stops it.
    if: >-
      !cancelled() && needs.prepare.result == 'success'
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Start new version
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            # Store the resolved version in the server's .env, so a later MANUAL
            # `docker compose pull/up -d` uses the same tag, not an old pin.
            if grep -q '^VERSION=' .env; then
              sed -i "s/^VERSION=.*/VERSION=${VERSION}/" .env
            else
              echo "VERSION=${VERSION}" >> .env
            fi
            docker compose -f docker-compose.prod.yml up -d
            # nginx.conf is mounted from the host, so `up -d` alone does not
            # reload it when the image tag is unchanged. Test and reload explicitly.
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload

      - name: Verify deployment health
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION
          script: |
            # Healthy alone is not enough (since 31.10.2026): the previous
            # version is healthy too, so a deploy in which compose did not
            # replace the container passed this check. The container must run
            # the tag being deployed.
            IMAGE=$(docker inspect --format '{{.Config.Image}}' abcwspinania-app-prod 2>/dev/null || echo "missing")
            if [ "${IMAGE##*:}" != "$VERSION" ]; then
              echo "ERROR: abcwspinania-app-prod runs '$IMAGE', expected tag '$VERSION'."
              exit 1
            fi
            echo "abcwspinania-app-prod runs $IMAGE"
            echo "Waiting for the app to report healthy..."
            for i in $(seq 1 16); do
              APP=$(docker inspect --format='{{.State.Health.Status}}' abcwspinania-app-prod 2>/dev/null || echo "missing")
              echo "Attempt $i/16: app = $APP"
              if [ "$APP" = "healthy" ]; then
                echo "Deployment confirmed."
                exit 0
              fi
              sleep 15
            done
            echo "ERROR: the app did not become healthy within 4 minutes."
            docker logs --tail 80 abcwspinania-app-prod || true
            exit 1

      - name: Smoke test public endpoints
        # Checks SMOKE_URL, or SITE_URL when it is not set. Two variables,
        # because while the site runs on the temporary domain, SITE_URL already
        # points at the TARGET domain (baked into the image: sitemap, canonical
        # URLs), where the client's old site still runs — the test would fail
        # there on every deploy. SMOKE_URL is deleted after the domain switch.
        # Without either variable the step is skipped.
        if: vars.SMOKE_URL != '' || vars.SITE_URL != ''
        env:
          BASE_URL: ${{ vars.SMOKE_URL || vars.SITE_URL }}
        run: |
          # The value is a space-separated list of accepted HTTP codes.
          # /api/courses must return 200 even with an empty collection — public
          # read access is declared in CODE (access.read in src/collections),
          # so unlike the previous CMS there is no "403 until someone clicks
          # the permissions" state.
          declare -A CHECKS=(
            ["${BASE_URL}/"]=200
            ["${BASE_URL}/robots.txt"]=200
            ["${BASE_URL}/sitemap.xml"]=200
            ["${BASE_URL}/api/courses"]=200
            ["${BASE_URL}/admin"]="200 302"
          )
          FAILED=0
          for url in "${!CHECKS[@]}"; do
            WANT="${CHECKS[$url]}"
            CODE="000"
            for attempt in 1 2 3; do
              CODE=$(curl -sS -m 15 -o /dev/null -w "%{http_code}" "$url" || echo "000")
              case " $WANT " in *" $CODE "*) break;; esac
              echo "  ${url} -> HTTP ${CODE} (attempt ${attempt}/3), retrying in 5 s..."
              sleep 5
            done
            case " $WANT " in
              *" $CODE "*) echo "OK   HTTP ${CODE}  ${url}" ;;
              *) echo "FAIL HTTP ${CODE} (expected ${WANT})  ${url}"; FAILED=1 ;;
            esac
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: at least one public URL did not respond correctly."
            exit 1
          fi
          echo "Smoke test passed."
