version: 2
updates:
  # --- The app (Next.js + Payload) ---
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # ESLint must stay on 9.x. `eslint-config-next` declares the peer
      # `eslint >=9`, so npm lets 10 in without a warning, but the
      # `eslint-plugin-react` that comes with it calls `context.getFilename()` —
      # an API removed in ESLint 10. Lint then fails at once on
      # "Error while loading rule 'react/display-name'".
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript is on 6.x — the NEWEST version that works here, not a backlog.
      # Measured 19.09.2026:
      #   • TS 6.0.3 → tsc, lint, test and build ALL pass. Hence "^6".
      #   • TS 7.0.2 → `npx tsc --noEmit` passes cleanly, but `npm run lint`
      #     fails hard on "typescript-eslint does not support TS 7.0."
      #     (typescript-eslint sits in eslint-config-next's tree; support is
      #     tracked for TS >= 7.1 — typescript-eslint/typescript-eslint#10940).
      # The block covers ONLY major 7; 6.x releases come in as usual.
      # Unblock when typescript-eslint ships support for 7 — and then rerun
      # the same four gates before merging.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Next 17 waits for Payload: `@payloadcms/next` declares the peer
      # `next >=16.3.3 <17.0.0`, so a Next major breaks `npm ci` with ERESOLVE.
      # Unblock when Payload widens that range.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      # graphql 17 likewise: `payload` and `@payloadcms/next` have the peer
      # `graphql ^16.8.1`. This major goes with a Payload major, not alone.
      - dependency-name: graphql
        update-types: ["version-update:semver-major"]
    groups:
      # ALL Payload packages MUST be on one version — `@payloadcms/next`
      # declares the peer `payload` to the exact number, so a mismatch breaks
      # `npm ci`. That is why they are pinned exactly in package.json and
      # bumped in one PR, never separately.
      payload:
        patterns:
          - "payload"
          - "@payloadcms/*"
      # Next and its ESLint config go as a pair too.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      # The catch-all group does not take packages from the two above. On
      # 28.09.2026, without `exclude-patterns`, Dependabot split Payload:
      # `payload` 3.90.2 in the `payload` group (#24), `@payloadcms/*` 3.90.2
      # in this one (#26) — both red on ERESOLVE, because each alone breaks
      # the exact-number peer. The exclusion removes the only place they could
      # escape to; whether that is enough, the next Payload release will show.
      # If the `payload` group again comes incomplete (or not at all), bump by
      # hand: every number in package.json at once, then `npm install`.
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "payload"
          - "@payloadcms/*"
          - "next"
          - "eslint-config-next"

  # --- GitHub Actions in the CI/CD workflows ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  # --- The base image in the Dockerfile ---
  # Node patches come by themselves: `node:26-alpine` is a floating tag that
  # points at the newest 26.x on every build — Dependabot has nothing to bump.
  # The only PR it would open is a jump to the next major, and odd Node majors
  # (27, 29) NEVER get LTS and die after about seven months. It would also
  # bump only the Dockerfile, leaving `node-version:` in ci.yml on the old
  # number. Changing the Node line is a decision: Dockerfile and ci.yml together.
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # --- Images in the compose files (postgres, nginx) ---
  # These are DELIBERATELY separate entries: the `docker` ecosystem above reads
  # only Dockerfiles, and Dependabot handles compose files in another
  # ecosystem, `docker-compose`. Without these two, postgres and nginx get NO
  # updates at all — in anovastudio nginx sat on 1.27 when 1.31 was out.
  #
  # The Postgres major block must be in BOTH entries. Both compose files mount
  # a persistent data volume, and Postgres refuses to start when another major
  # created the directory ("database files are incompatible with server"). A
  # major bump is a DATA MIGRATION, so merging the PR alone ends with a
  # database that does not start. Dev keeps the same version as production;
  # a mismatch means testing on a different database engine.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
