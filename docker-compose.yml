# DEVELOPMENT environment — the database only.
#
# The application (Next.js with Payload inside) runs locally through
# `npm run dev` — reloading code inside a container is slower and confuses
# paths. The container holds only what we do not want to install on the
# machine: Postgres.
#
# THE POSTGRES MAJOR VERSION MUST MATCH PRODUCTION (deploy/docker-compose.prod.yml).
# A mismatch here means testing on a different database engine than the one
# serving the client. The major is blocked in .github/dependabot.yml — in BOTH
# compose entries.
#
# HOST PORT 5435. The port registry of the Projects directory (as of 26.10.2026):
#   5432 → next-step-pro-climbing-hub, first-aid-kit-api
#   5433 → fire-academy-hub, template_project, first-aid-kit-api (dev)
#   5434 → anovastudio
#   5435 → abcwspinania  ← this project
#   5436 → kd-training (since 26.10.2026)
# The next project takes 5437. Without this registry two projects will not
# start at once.

services:
  postgres:
    image: postgres:18-alpine
    container_name: abcwspinania-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: abcwspinania
      POSTGRES_USER: abcwspinania
      # The development password — deliberately trivial and public. The database
      # listens only on 127.0.0.1, holds no client data, and a secret in the repo
      # would be worse than none. Production takes its password from deploy/.env.
      POSTGRES_PASSWORD: abcwspinania
    ports:
      # Loopback only. Without "127.0.0.1:" Docker opens the port on ALL
      # interfaces, bypassing the host firewall — the development database would
      # be visible on the local network (a café, a hotel, a coworking space).
      - "127.0.0.1:5435:5432"
    volumes:
      # NOTE: the mount point is /var/lib/postgresql, NOT /var/lib/postgresql/data.
      # postgres:18+ images keep data in a subdirectory named after the major
      # version (/var/lib/postgresql/18/docker), so that `pg_upgrade --link` can
      # be used without crossing a mount boundary. A volume mounted at the old
      # /var/lib/postgresql/data makes the container NOT START — it reports
      # "there appears to be PostgreSQL data in: /var/lib/postgresql/data
      # (unused mount/volume)" and ends up unhealthy.
      # Checked on the postgres:18-alpine image 19.09.2026. Details:
      # https://github.com/docker-library/postgres/pull/1259
      - abcwspinania_pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abcwspinania -d abcwspinania"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  abcwspinania_pgdata_dev:
