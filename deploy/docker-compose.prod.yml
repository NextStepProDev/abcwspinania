# Production — Oracle Cloud, the Ampere A1 shape (aarch64).
#
# ⚠️ ARCHITECTURE: Ampere A1 is ARM64. The image MUST be built for linux/arm64
# (see .github/workflows/ci.yml — the docker job runs on ubuntu-24.04-arm). An
# amd64 image starts here with "exec format error", visible only on the server.
#
# ONE APPLICATION. Payload runs inside Next.js, so the site, the panel and the
# API are the same process — there is no separate CMS container and no api.*
# subdomain.
#
# MEMORY BUDGET AND TUNING are parameterised through .env — together, as one
# profile, so that a container limit cannot be changed without recomputing
# what actually runs in it. The defaults below assume the WHOLE free Ampere
# machine (2 OCPU / 12 GB):
#     postgres 1g + app 2g + nginx 128m ≈ 3.2 GB
# Splitting the Ampere allowance into two instances (1 OCPU / 6 GB)? Uncomment
# the "half machine" profile in .env.example — the limits AND the Postgres/Node
# tuning together.

# Log rotation for every container. Docker's default json-file driver keeps
# logs without limit: the disk fills slowly, and nginx's access log keeps
# every visitor's IP address forever, which the privacy policy cannot promise.
# 3 files × 10 MB per container; the oldest entries are overwritten.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# No process in a container may gain privileges it did not start with
# (setuid binaries, file capabilities) — a cheap belt in case one is taken
# over (audit, 25.10.2026). Postgres and nginx start as root and drop to their
# own users, which this allows; checked on both images before adding it.
x-security: &security
  - no-new-privileges:true

services:
  postgres:
    # The MAJOR VERSION must match docker-compose.yml at the repo root.
    # The major is blocked in .github/dependabot.yml — in BOTH compose entries.
    # A major bump is a DATA MIGRATION, not an image swap (see CLAUDE.md).
    image: postgres:18-alpine
    container_name: abcwspinania-postgres-prod
    logging: *logging
    security_opt: *security
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Published ONLY on the server's loopback. The database is not visible from
    # the internet; this port exists so that the "Migrate" workflow (and
    # Deploy, which calls it) can reach it through an SSH tunnel and apply
    # migrations. Without "127.0.0.1:" Docker would open it on every
    # interface, BYPASSING the host firewall.
    ports:
      - "127.0.0.1:5432:5432"
    # Tuning goes together with mem_limit, so they never drift apart when the
    # profile changes (see CLAUDE.md: "You change POSTGRES_MEM_LIMIT — lower
    # shared_buffers and effective_cache_size too"). The defaults below are the
    # "whole machine" profile; the "half machine" profile overrides them in .env.
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      -c work_mem=${POSTGRES_WORK_MEM:-8MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-40}
      -c random_page_cost=1.1
    volumes:
      # ⚠️ THE MOUNT POINT IS /var/lib/postgresql, NOT /var/lib/postgresql/data.
      # postgres:18+ images keep data in a subdirectory named after the major
      # version (/var/lib/postgresql/18/docker). With the old mount point the
      # container DOES NOT START: "there appears to be PostgreSQL data in:
      # /var/lib/postgresql/data (unused mount/volume)". Checked on
      # postgres:18-alpine 19.09.2026.
      - abcwspinania_pgdata_prod:/var/lib/postgresql
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  app:
    image: ghcr.io/${GHCR_OWNER}/abcwspinania:${VERSION:-latest}
    container_name: abcwspinania-app-prod
    logging: *logging
    security_opt: *security
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Signs the panel's session tokens. MUST differ from the local one.
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      # Emails through Brevo. Empty = emails only in the container log (Payload
      # warns about it at start). The variables are described in deploy/.env.example.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-ABC Wspinania}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
      CAMP_EMAIL: ${CAMP_EMAIL:-}
      # The address the site ACTUALLY runs at — links in emails are built from
      # it (account confirmation, new password). See deploy/.env.example.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Must match APP_MEM_LIMIT for the same reason as the Postgres tuning
      # above — the container limit alone tells Node nothing.
      NODE_OPTIONS: "--max-old-space-size=${NODE_MAX_OLD_SPACE_SIZE:-1536}"
    volumes:
      # Files uploaded through the panel. The mount point matches UPLOAD_DIR
      # set in web/Dockerfile.
      - abcwspinania_uploads_prod:/app/uploads
      # The image optimiser's cache — a named volume, so it survives a container
      # restart; otherwise every photo is recomputed from scratch.
      - abcwspinania_image_cache_prod:/app/.next/cache
    mem_limit: ${APP_MEM_LIMIT:-2g}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  nginx:
    image: nginx:1.31-alpine
    container_name: abcwspinania-nginx-prod
    logging: *logging
    security_opt: *security
    restart: unless-stopped
    # IPv4 only. Without an address Docker publishes on IPv6 as well, and that
    # path bypasses the Cloudflare-only firewall (deploy/origin-firewall.sh),
    # which filters IPv4. Cloudflare reaches us over IPv4 — the DNS record of
    # the origin is an A record.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
    # 128m, not 32m. In anovastudio nginx with a 32m limit was OOM-killed when 27
    # photos were uploaded to the media library at once; 64m fixed it.
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    depends_on: [app]
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  abcwspinania_pgdata_prod:
  abcwspinania_uploads_prod:
  abcwspinania_image_cache_prod:
