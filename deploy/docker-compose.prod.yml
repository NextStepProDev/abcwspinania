# Produkcja — Oracle Cloud, kształt Ampere A1 (aarch64).
#
# ⚠️ ARCHITEKTURA: Ampere A1 to ARM64. Obraz MUSI być zbudowany pod linux/arm64
# (patrz .github/workflows/ci.yml — job docker leci na ubuntu-24.04-arm). Obraz
# amd64 wstaje tu z "exec format error", widocznym dopiero na serwerze.
#
# JEDNA APLIKACJA. Payload działa wewnątrz Next.js, więc strona, panel i API to
# ten sam proces — nie ma osobnego kontenera CMS-a ani subdomeny api.*.
#
# BUDŻET PAMIĘCI I STROJENIE parametryzowane przez .env — razem, jednym
# profilem, żeby nie dało się zmienić limitu kontenera bez przeliczenia tego,
# co w nim faktycznie działa. Wartości domyślne poniżej zakładają CAŁĄ
# darmową maszynę Ampere (2 OCPU / 12 GB):
#     postgres 1g + app 2g + nginx 128m ≈ 3,2 GB
# Dzielisz limit Ampere na dwie instancje (1 OCPU / 6 GB)? Odkomentuj profil
# "pół maszyny" w .env.example — limity I strojenie Postgresa/Node'a razem.

# Log rotation for every container. Docker's default json-file driver keeps
# logs without limit: the disk fills slowly, and nginx's access log keeps
# every visitor's IP address forever, which the privacy policy cannot promise.
# 3 files × 10 MB per container; the oldest entries are overwritten.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# No process in a container may gain privileges it did not start with
# (setuid binaries, file capabilities) — a cheap belt in case one is taken
# over (audit, 25.10.2026). Postgres and nginx start as root and drop to their
# own users, which this allows; checked on both images before adding it.
x-security: &security
  - no-new-privileges:true

services:
  postgres:
    # WERSJA GŁÓWNA musi się zgadzać z docker-compose.yml w korzeniu repo.
    # Major zablokowany w .github/dependabot.yml — w OBU wpisach compose.
    # Podbicie majora to MIGRACJA DANYCH, nie podmiana obrazu (patrz CLAUDE.md).
    image: postgres:18-alpine
    container_name: abcwspinania-postgres-prod
    logging: *logging
    security_opt: *security
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Publikacja WYŁĄCZNIE na pętli zwrotnej serwera. Baza nie jest widoczna
    # z internetu; ten port istnieje po to, żeby workflow „Migrate" mógł się
    # do niej dostać tunelem SSH i zastosować migracje. Bez "127.0.0.1:"
    # Docker otworzyłby go na wszystkich interfejsach, OMIJAJĄC zaporę hosta.
    ports:
      - "127.0.0.1:5432:5432"
    # Strojenie idzie razem z mem_limit, żeby nigdy nie rozjechały się przy
    # zmianie profilu (patrz CLAUDE.md: "zmieniasz POSTGRES_MEM_LIMIT — obniż
    # też shared_buffers i effective_cache_size"). Wartości domyślne poniżej
    # to profil "cała maszyna"; profil "pół maszyny" nadpisuje je w .env.
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      -c work_mem=${POSTGRES_WORK_MEM:-8MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-40}
      -c random_page_cost=1.1
    volumes:
      # ⚠️ PUNKT MONTOWANIA TO /var/lib/postgresql, NIE /var/lib/postgresql/data.
      # Obrazy postgres:18+ trzymają dane w podkatalogu z numerem wersji głównej
      # (/var/lib/postgresql/18/docker). Przy starym punkcie kontener NIE WSTAJE:
      # "there appears to be PostgreSQL data in: /var/lib/postgresql/data
      # (unused mount/volume)". Sprawdzone na postgres:18-alpine 19.09.2026.
      - abcwspinania_pgdata_prod:/var/lib/postgresql
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  app:
    image: ghcr.io/${GHCR_OWNER}/abcwspinania:${VERSION:-latest}
    container_name: abcwspinania-app-prod
    logging: *logging
    security_opt: *security
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Podpisuje tokeny sesji panelu. MUSI być inny niż lokalnie.
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      # Maile przez Brevo. Puste = maile tylko w logu kontenera (Payload
      # ostrzega o tym przy starcie). Opis zmiennych: deploy/.env.example.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-ABC Wspinania}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
      CAMP_EMAIL: ${CAMP_EMAIL:-}
      # Adres, pod którym strona FAKTYCZNIE działa — z niego idą linki
      # w mailach (potwierdzenie konta, nowe hasło). Opis: deploy/.env.example.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Musi się zgadzać z APP_MEM_LIMIT z tego samego powodu co strojenie
      # Postgresa wyżej — sam limit kontenera Node'owi nic nie mówi.
      NODE_OPTIONS: "--max-old-space-size=${NODE_MAX_OLD_SPACE_SIZE:-1536}"
    volumes:
      # Pliki wgrane przez panel. Punkt montowania zgodny z UPLOAD_DIR
      # ustawionym w web/Dockerfile.
      - abcwspinania_uploads_prod:/app/uploads
      # Cache optymalizatora obrazów — nazwany wolumen, żeby przeżył restart
      # kontenera; inaczej każde zdjęcie jest przeliczane od nowa.
      - abcwspinania_image_cache_prod:/app/.next/cache
    mem_limit: ${APP_MEM_LIMIT:-2g}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  nginx:
    image: nginx:1.31-alpine
    container_name: abcwspinania-nginx-prod
    logging: *logging
    security_opt: *security
    restart: unless-stopped
    # IPv4 only. Without an address Docker publishes on IPv6 as well, and that
    # path bypasses the Cloudflare-only firewall (deploy/origin-firewall.sh),
    # which filters IPv4. Cloudflare reaches us over IPv4 — the DNS record of
    # the origin is an A record.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
    # 128m, nie 32m. W anovastudio nginx z limitem 32m dostawał OOM przy wysyłce
    # 27 zdjęć naraz do biblioteki mediów; 64m to naprawiło.
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    depends_on: [app]
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  abcwspinania_pgdata_prod:
  abcwspinania_uploads_prod:
  abcwspinania_image_cache_prod:
