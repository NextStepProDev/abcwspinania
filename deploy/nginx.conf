# Reverse proxy dla ABC Wspinania.
#
# Domena: abcwspinania.info — DO POTWIERDZENIA z klientem, czy zostaje ta sama.
# Rekordy A (@ i www) muszą wskazywać publiczny adres instancji Oracle.
# Certyfikat obejmuje domenę główną i www. Do dnia przełączenia leży tu
# tymczasowy (self-signed); docelowo Origin Certificate z Cloudflare — patrz
# „Domena tymczasowa i Cloudflare" w CLAUDE.md i blok na końcu tego pliku.
#
# JEDNA APLIKACJA, JEDEN UPSTREAM. Payload działa wewnątrz Next.js, więc strona,
# panel (/admin) i API (/api) to ten sam proces na porcie 3000. Przy Strapim
# potrzebna była tu osobna subdomena api.* z własnym blokiem server — panel
# używał wielu ścieżek w korzeniu i rozdzielenie po hostach było jedynym
# stabilnym routingiem. Teraz to odpada, razem z trzecią nazwą w certyfikacie.

# Anty-brute-force: bufor limitów per-IP dla ścieżek logowania.
# Świadomie WĄSKI zakres — tylko logowanie — żeby nie dotknąć wysyłki zdjęć
# do biblioteki mediów ani ładowania assetów panelu.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Prawdziwy adres odwiedzającego zza Cloudflare.
#
# Za proxy Cloudflare każde połączenie przychodzi z adresu Cloudflare, więc
# limit logowania wyżej liczyłby WSZYSTKICH odwiedzających jako jeden adres —
# pięć nieudanych logowań kogokolwiek blokowałoby panel każdemu. Moduł realip
# podmienia $remote_addr (i $binary_remote_addr) na adres z CF-Connecting-IP,
# ale TYLKO gdy połączenie faktycznie przyszło z puli Cloudflare. Ruch bez
# Cloudflare (dziś abcwspinania.info) nie jest tym dotknięty, a podrobiony
# nagłówek wysłany prosto na serwer jest ignorowany.
#
# Lista z https://www.cloudflare.com/ips-v4 i /ips-v6, pobrana 26.09.2026.
# Cloudflare zmienia ją rzadko, ale zmienia — adres spoza listy wróciłby do
# stanu „wszyscy jako jeden adres", bez żadnego błędu.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# HTTP: ACME challenge + przekierowanie na HTTPS
server {
    listen 80;
    server_name abcwspinania.info www.abcwspinania.info;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://abcwspinania.info$request_uri;
    }
}

# www → domena główna (301). Certyfikat obejmuje www, więc TLS musi tu być pełny —
# przeglądarka nawiązuje połączenie, ZANIM zobaczy przekierowanie.
#
# Sam `rel=canonical` nie wystarczał: oba hosty odpowiadały kodem 200, Google
# indeksował dwa adresy i sam musiał zgadywać, który jest właściwy, a linki
# przychodzące rozjeżdżały się na dwie domeny. 301 rozstrzyga to jednoznacznie.
server {
    listen 443 ssl;
    http2 on;
    server_name www.abcwspinania.info;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # HSTS także na przekierowaniu — inaczej subdomena www zostaje bez nagłówka,
    # a `includeSubDomains` z domeny głównej działa dopiero po jej odwiedzeniu.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://abcwspinania.info$request_uri;
}

# Aplikacja — strona, panel i API
server {
    listen 443 ssl;
    http2 on;
    server_name abcwspinania.info;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS hardening — tylko nowoczesne protokoły + preferencje serwera dla TLS1.2
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Nie ujawniaj wersji nginx w nagłówku Server ani na stronach błędów
    server_tokens off;

    # Nagłówki bezpieczeństwa (always = także na odpowiedziach błędów)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy ŚWIADOMIE NIE MA TUTAJ — ustawia ją aplikacja
    # (web/next.config.ts), bo tylko ona wie, które trasy są panelem, a panel
    # wymaga luźniejszej polityki niż strona. Nagłówek wysłany z obu miejsc
    # dotarłby do przeglądarki podwójnie.

    # Limit wysyłanego pliku spójny z `upload.limits.fileSize` w
    # web/src/payload.config.ts (25 MB). Rozjazd daje 413 z nginx, ZANIM żądanie
    # dojdzie do aplikacji — i błąd, którego nie widać w jej logach.
    client_max_body_size 25m;

    # Generowanie wariantów zdjęć przez sharp przekracza domyślne 60 s — bez tego
    # wysyłki do biblioteki mediów kończą się 504 mimo sukcesu w tle. Zostawiamy
    # zapas mimo 2 OCPU: przy kilkudziesięciu zdjęciach naraz i tak ustawiają się
    # w kolejkę, a zapas nic nie kosztuje.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Rate-limit logowania do panelu (5/min, burst 10). Ścieżka dokładna, nie
    # prefiks — reszta /admin (assety, edytor) bez limitu, żeby nie dławić pracy.
    location = /api/users/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/users/first-register {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/users/forgot-password {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # reset-password i unlock przyjmują TOKEN — też da się je zgadywać seryjnie,
    # więc podlegają temu samemu limitowi co logowanie. Lista endpointów
    # uwierzytelniania Payloada zweryfikowana w payload/dist/auth/endpoints:
    # login, logout, refresh-token, me, init, access, first-register,
    # forgot-password, reset-password, unlock. Limitujemy te, które przyjmują
    # sekret; reszta go nie dotyka.
    location = /api/users/reset-password {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/users/unlock {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pliki z biblioteki mediów — cache po stronie przeglądarki, miesiąc.
    #
    # ŚWIADOMIE BEZ `immutable`. Stał tu z uzasadnieniem „Payload nadaje nazwom
    # hash" — nieprawdziwym, zmierzone 23.09.2026: plik wgrany jako `skaly.jpg`
    # leży pod `/api/media/file/skaly.jpg`, bez hasha. Podmiana pliku na
    # istniejącym wpisie zachowuje adres, a `immutable` znaczy dosłownie „nie
    # pytaj ponownie" — Krzysiek podmieniłby zdjęcie i stara wersja siedziałaby
    # u odwiedzających miesiąc, nie do ruszenia nawet odświeżeniem strony.
    # `stale-while-revalidate` daje ten sam cache, ale z możliwością podmiany.
    #
    # JEDEN scalony Cache-Control: `expires` i `add_header` naraz wysyłały ten
    # nagłówek dwa razy, z różną treścią. Nagłówki bezpieczeństwa powtórzone,
    # bo własny add_header w bloku location KASUJE dziedziczenie z bloku server.
    location /api/media/file/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }

    # Zdjęcia galerii — osobna kolekcja, więc osobna ścieżka (Payload serwuje
    # pliki pod /api/<slug>/file/). Bez tego bloku trafiały do `location /`
    # i przeglądarka pytała o każde z pięćdziesięciu przy każdym wejściu.
    #
    # ŚWIADOMIE BEZ `immutable`, tak samo jak blok Mediów wyżej. Zmierzone
    # 23.09.2026: Payload NIE dokłada hasha do nazwy — plik wgrany jako
    # `skaly.jpg` leży pod `/api/gallery-photos/file/skaly.jpg`. Podmiana
    # pliku na istniejącym wpisie zachowuje adres, więc `immutable` kazałby
    # przeglądarkom trzymać starą wersję przez miesiąc, bez sposobu na
    # wymuszenie odświeżenia. Blok Mediów wyżej został poprawiony tak samo.
    location /api/gallery-photos/file/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }

    # Zdjęcia i logotypy z public/ — Next oddaje je z max-age=0, więc bez tego
    # przeglądarka pyta o każdy kadr przy każdym wejściu. Tydzień + doba
    # serwowania starej wersji w tle; nazwy nie mają hasha, więc świadomie
    # NIE dajemy `immutable` (patrz komentarz w web/next.config.ts).
    location ~* ^/(images|logo)/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================================
# DOMENA TYMCZASOWA — szkolawspinaczkowa.pl, za Cloudflare.
#
# Strona stoi tu do czasu przełączenia abcwspinania.info (ustalone 26.09.2026).
# Bloki wyżej są dla domeny docelowej i ŚWIADOMIE nie wiedzą o tej — w dniu
# przełączenia usuwa się ten fragment w całości (albo zamienia na przekierowanie
# 301 do abcwspinania.info), nie dotykając niczego powyżej.
#
# Kopia jest celowo UBOŻSZA niż blok domeny docelowej: bez osobnych reguł
# cache'u dla zdjęć (to wersja robocza, nie ruch klientów). Zostaje wszystko,
# co chroni: limit logowania, nagłówki bezpieczeństwa, limit wysyłki.
#
# ⚠️ Plik certyfikatu MUSI leżeć na serwerze, ZANIM ten config tam trafi.
# Brak pliku = `nginx -t` pada, a przy najbliższym restarcie kontenera nginx
# nie wstaje wcale — razem z domeną docelową. Certyfikat to Origin Certificate
# z Cloudflare (ważny 15 lat), nie Let's Encrypt, więc nie wymaga odnawiania.
# =============================================================================

server {
    listen 80;
    server_name szkolawspinaczkowa.pl www.szkolawspinaczkowa.pl;

    return 301 https://szkolawspinaczkowa.pl$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name szkolawspinaczkowa.pl www.szkolawspinaczkowa.pl;

    ssl_certificate /etc/nginx/certs/szkolawspinaczkowa-origin.pem;
    ssl_certificate_key /etc/nginx/certs/szkolawspinaczkowa-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # Wersja robocza nie może trafić do Google. Gdyby trafiła, po przełączeniu
    # Google widziałby tę samą treść pod dwiema domenami i sam wybierał, którą
    # pokazywać. Nagłówek, a nie Disallow w robots.txt: zakaz w robots.txt
    # blokuje czytanie strony, więc Google nie zobaczyłby `noindex` i mógłby
    # zaindeksować sam adres z linków przychodzących.
    #
    # Żaden `location` niżej nie ma własnego add_header — gdyby miał, skasowałby
    # dziedziczenie tych nagłówków, łącznie z tym jednym.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # HSTS bez `includeSubDomains` i `preload`: to domena tymczasowa i nie
    # chcemy przesądzać na dwa lata, co będzie na jej subdomenach.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Te same wartości i te same powody co w bloku domeny docelowej.
    client_max_body_size 25m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Ta sama lista endpointów co w bloku domeny docelowej, w jednym wyrażeniu.
    # Za Cloudflare limit liczy prawdziwe adresy dzięki realip na górze pliku.
    location ~ ^/api/users/(login|first-register|forgot-password|reset-password|unlock)$ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
