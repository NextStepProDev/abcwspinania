# Reverse proxy dla ABC Wspinania.
#
# Domena: abcwspinania.info — DO POTWIERDZENIA z klientem, czy zostaje ta sama.
# Rekordy A (@ i www) muszą wskazywać publiczny adres instancji Oracle.
# Certyfikat Let's Encrypt obejmuje domenę główną i www (certbot -d ... x2).
#
# JEDNA APLIKACJA, JEDEN UPSTREAM. Payload działa wewnątrz Next.js, więc strona,
# panel (/admin) i API (/api) to ten sam proces na porcie 3000. Przy Strapim
# potrzebna była tu osobna subdomena api.* z własnym blokiem server — panel
# używał wielu ścieżek w korzeniu i rozdzielenie po hostach było jedynym
# stabilnym routingiem. Teraz to odpada, razem z trzecią nazwą w certyfikacie.

# Anty-brute-force: bufor limitów per-IP dla ścieżek logowania.
# Świadomie WĄSKI zakres — tylko logowanie — żeby nie dotknąć wysyłki zdjęć
# do biblioteki mediów ani ładowania assetów panelu.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# HTTP: ACME challenge + przekierowanie na HTTPS
server {
    listen 80;
    server_name abcwspinania.info www.abcwspinania.info;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://abcwspinania.info$request_uri;
    }
}

# www → domena główna (301). Certyfikat obejmuje www, więc TLS musi tu być pełny —
# przeglądarka nawiązuje połączenie, ZANIM zobaczy przekierowanie.
#
# Sam `rel=canonical` nie wystarczał: oba hosty odpowiadały kodem 200, Google
# indeksował dwa adresy i sam musiał zgadywać, który jest właściwy, a linki
# przychodzące rozjeżdżały się na dwie domeny. 301 rozstrzyga to jednoznacznie.
server {
    listen 443 ssl;
    http2 on;
    server_name www.abcwspinania.info;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # HSTS także na przekierowaniu — inaczej subdomena www zostaje bez nagłówka,
    # a `includeSubDomains` z domeny głównej działa dopiero po jej odwiedzeniu.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://abcwspinania.info$request_uri;
}

# Aplikacja — strona, panel i API
server {
    listen 443 ssl;
    http2 on;
    server_name abcwspinania.info;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS hardening — tylko nowoczesne protokoły + preferencje serwera dla TLS1.2
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Nie ujawniaj wersji nginx w nagłówku Server ani na stronach błędów
    server_tokens off;

    # Nagłówki bezpieczeństwa (always = także na odpowiedziach błędów)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy ŚWIADOMIE NIE MA TUTAJ — ustawia ją aplikacja
    # (web/next.config.ts), bo tylko ona wie, które trasy są panelem, a panel
    # wymaga luźniejszej polityki niż strona. Nagłówek wysłany z obu miejsc
    # dotarłby do przeglądarki podwójnie.

    # Limit wysyłanego pliku spójny z `upload.limits.fileSize` w
    # web/src/payload.config.ts (25 MB). Rozjazd daje 413 z nginx, ZANIM żądanie
    # dojdzie do aplikacji — i błąd, którego nie widać w jej logach.
    client_max_body_size 25m;

    # Generowanie wariantów zdjęć przez sharp przekracza domyślne 60 s — bez tego
    # wysyłki do biblioteki mediów kończą się 504 mimo sukcesu w tle. Zostawiamy
    # zapas mimo 2 OCPU: przy kilkudziesięciu zdjęciach naraz i tak ustawiają się
    # w kolejkę, a zapas nic nie kosztuje.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Rate-limit logowania do panelu (5/min, burst 10). Ścieżka dokładna, nie
    # prefiks — reszta /admin (assety, edytor) bez limitu, żeby nie dławić pracy.
    location = /api/users/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/users/first-register {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/users/forgot-password {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # reset-password i unlock przyjmują TOKEN — też da się je zgadywać seryjnie,
    # więc podlegają temu samemu limitowi co logowanie. Lista endpointów
    # uwierzytelniania Payloada zweryfikowana w payload/dist/auth/endpoints:
    # login, logout, refresh-token, me, init, access, first-register,
    # forgot-password, reset-password, unlock. Limitujemy te, które przyjmują
    # sekret; reszta go nie dotyka.
    location = /api/users/reset-password {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/users/unlock {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pliki z biblioteki mediów — cache po stronie przeglądarki. Payload nadaje
    # nazwom hash, więc treść pod danym adresem się nie zmienia i `immutable`
    # jest tu bezpieczne.
    #
    # JEDEN scalony Cache-Control: `expires` i `add_header` naraz wysyłały ten
    # nagłówek dwa razy, z różną treścią. Nagłówki bezpieczeństwa powtórzone,
    # bo własny add_header w bloku location KASUJE dziedziczenie z bloku server.
    location /api/media/file/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Zdjęcia i logotypy z public/ — Next oddaje je z max-age=0, więc bez tego
    # przeglądarka pyta o każdy kadr przy każdym wejściu. Tydzień + doba
    # serwowania starej wersji w tle; nazwy nie mają hasha, więc świadomie
    # NIE dajemy `immutable` (patrz komentarz w web/next.config.ts).
    location ~* ^/(images|logo)/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
