# Reverse proxy for ABC Wspinania.
#
# Domain: abcwspinania.info — TO BE CONFIRMED with the client that it stays.
# The A records (@ and www) must point to the Oracle instance's public address.
# The certificate covers the bare domain and www. Until the switch a temporary
# one (self-signed) sits here; the target is a Cloudflare Origin Certificate —
# see "Temporary domain and Cloudflare" in CLAUDE.md and the block at the end
# of this file.
#
# ONE APPLICATION, ONE UPSTREAM. Payload runs inside Next.js, so the site, the
# panel (/admin) and the API (/api) are the same process on port 3000. With
# Strapi this needed a separate api.* subdomain with its own server block — the
# panel used many paths at the root, and splitting by host was the only stable
# routing. That is gone now, together with the third name on the certificate.

# Anti-brute-force: a per-IP limit buffer for the login paths.
# Deliberately NARROW — login only — so that uploading photos to the media
# library and loading the panel's assets are not touched.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Participant account forms (login, registration, password) — only
# SUBMISSIONS are counted. Next's server actions are POSTed to the page's own
# address (/logowanie, /rejestracja, /konto/…), so a limit on the path alone
# would also throttle simply opening the page. An empty key for GET = a request
# not counted (that is how limit_req_zone treats an empty key).
# Why the limit: registration and "nie pamiętam hasła" send an email to the
# given address — without it the form would be free spam sending from our
# domain and would eat Brevo's daily limit (300).
map $request_method $account_form_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $account_form_key zone=account_forms:10m rate=10r/m;

# Forms on ANY page — the newsletter sits in the footer, the contact form on
# /kontakt. A Next server action is a POST with a `Next-Action` header to the
# current page's address, so the limit cannot be pinned to a path. An empty key
# (= not counted) for everything that is not an action. Both forms send emails
# (the newsletter confirmation, the school's notification) — without a limit a
# script would eat Brevo's daily limit and flood other people's inboxes with
# confirmation links.
# ⚠️ The panel (/admin) is EXEMPT from the limit: Payload uses server actions
# too, while a form is edited in the panel — ten a minute would block work.
# The panel has its own protection: login (the `login` zone) and a school account.
# ⚠️ Next runs a server action posted to ANY page, so the site's own forms,
# posted to /admin, skip this zone (audit, 25.10.2026). The application keeps
# its own budget for them behind this one — `web/src/lib/actionLimit.ts`.
map "$request_method:$http_next_action:$uri" $site_action_key {
    "~^POST:[^:]+:/admin(/|$)" "";
    "~^POST:.+:"                $binary_remote_addr;
    default                     "";
}
limit_req_zone $site_action_key zone=site_actions:10m rate=10r/m;

# The visitor's real address from behind Cloudflare.
#
# Behind the Cloudflare proxy every connection comes from a Cloudflare address,
# so the login limit above would count ALL visitors as one address — five
# failed logins by anyone would block the panel for everyone. The realip module
# swaps $remote_addr (and $binary_remote_addr) for the address from
# CF-Connecting-IP, but ONLY when the connection really came from the
# Cloudflare pool. A forged header sent straight to the server is ignored
# (and since 27.10.2026 the firewall lets only Cloudflare reach ports 80 and
# 443 at all — deploy/origin-firewall.sh, which reads its ranges from here).
#
# The list from https://www.cloudflare.com/ips-v4 and /ips-v6, fetched
# 26.09.2026. Cloudflare changes it rarely, but it does — a range missing here
# means error 522 for the visitors that Cloudflare location serves.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name abcwspinania.info www.abcwspinania.info;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://abcwspinania.info$request_uri;
    }
}

# www → the bare domain (301). The certificate covers www, so TLS must be full
# here — the browser connects BEFORE it sees the redirect.
#
# `rel=canonical` alone was not enough: both hosts answered 200, Google indexed
# two addresses and had to guess which was the right one, and incoming links
# split across two domains. A 301 settles it unambiguously.
server {
    listen 443 ssl;
    http2 on;
    server_name www.abcwspinania.info;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # HSTS on the redirect too — otherwise the www subdomain is left without the
    # header, and `includeSubDomains` from the bare domain only works after it
    # has been visited.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://abcwspinania.info$request_uri;
}

# The application — site, panel and API
server {
    listen 443 ssl;
    http2 on;
    server_name abcwspinania.info;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS hardening — modern protocols only + server preference for TLS1.2
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Do not reveal the nginx version in the Server header or on error pages
    server_tokens off;

    # Security headers (always = on error responses too)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy is DELIBERATELY NOT HERE — the application sets it
    # (web/next.config.ts), because only it knows which routes are the panel,
    # and the panel needs a looser policy than the site. A header sent from
    # both places would reach the browser twice.

    # The upload size limit matches `upload.limits.fileSize` in
    # web/src/payload.config.ts (25 MB). A mismatch gives a 413 from nginx
    # BEFORE the request reaches the application — an error its logs never show.
    client_max_body_size 25m;

    # Generating photo variants with sharp goes past the default 60 s — without
    # this, uploads to the media library end in a 504 despite succeeding in the
    # background. The headroom stays despite 2 OCPU: with dozens of photos at
    # once they queue up anyway, and the headroom costs nothing.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Rate limit on panel login (5/min, burst 10). An exact path, not a prefix —
    # the rest of /admin (assets, the editor) has no limit, so work is not throttled.
    location = /api/users/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/users/first-register {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/users/forgot-password {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # reset-password and unlock accept a TOKEN — it can be guessed in series too,
    # so they get the same limit as login. Payload's list of auth endpoints,
    # checked in payload/dist/auth/endpoints: login, logout, refresh-token, me,
    # init, access, first-register, forgot-password, reset-password, unlock.
    # We limit the ones that accept a secret; the rest do not touch one.
    location = /api/users/reset-password {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/users/unlock {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Participant accounts (the `customers` collection) ---
    #
    # first-register CLOSED: Payload exposes it for EVERY collection with login,
    # and while the table is empty it creates an account through it bypassing
    # the access rules, confirmed and logged in at once
    # (payload/dist/auth/operations/registerFirstUser.js). Participants create
    # accounts only through /rejestracja.
    location = /api/customers/first-register {
        return 404;
    }

    # Address confirmation CLOSED in the API: the link from the email works for
    # 48 h, and the /konto/potwierdz page checks that — Payload's token does not
    # expire by itself, so the API endpoint would confirm from a link of any age.
    location ^~ /api/customers/verify/ {
        return 404;
    }

    # Endpoints accepting a secret (a password or a token from an email) — the
    # same limit as panel login.
    location ~ ^/api/customers/(login|forgot-password|reset-password|unlock)$ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Account pages, course and camp bookings, the registration form — the limit
    # counts only form submissions (see `map` at the top). A booking sends emails too.
    location ~ ^/((logowanie|rejestracja|konto)(/|$)|(kursy|obozy)/[^/]+/zapis$|obozy/rejestracja$) {
        limit_req zone=account_forms burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Files from the media library — a month of browser cache.
    #
    # DELIBERATELY WITHOUT `immutable`. It stood here with the reason "Payload
    # hashes file names" — untrue, measured 23.09.2026: a file uploaded as
    # `skaly.jpg` sits under `/api/media/file/skaly.jpg`, with no hash. Replacing
    # the file on an existing entry keeps the address, and `immutable` literally
    # means "do not ask again" — Krzysiek would replace a photo and the old
    # version would stay with visitors for a month, untouchable even by a reload.
    # `stale-while-revalidate` gives the same cache, but replaceable.
    #
    # ONE merged Cache-Control: `expires` and `add_header` together sent this
    # header twice, with different values. The security headers are repeated,
    # because an add_header of its own in a location block DROPS inheritance
    # from the server block.
    location /api/media/file/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }

    # Gallery photos — a separate collection, so a separate path (Payload serves
    # files under /api/<slug>/file/). Without this block they went to
    # `location /`, and the browser asked about each of fifty on every visit.
    #
    # DELIBERATELY WITHOUT `immutable`, like the Media block above. Measured
    # 23.09.2026: Payload does NOT add a hash to the name — a file uploaded as
    # `skaly.jpg` sits under `/api/gallery-photos/file/skaly.jpg`. Replacing the
    # file on an existing entry keeps the address, so `immutable` would make
    # browsers keep the old version for a month, with no way to force a refresh.
    # Home page hero photos — two collections (wide and upright), one block:
    # same policy as Media and the gallery above, the same reason for no
    # `immutable`.
    location ~ ^/api/hero-(wide|tall)-photos/file/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }

    location /api/gallery-photos/file/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }

    # Photos and logos from public/ — Next serves them with max-age=0, so
    # without this the browser asks about every image on every visit. A week +
    # a day of serving the old version while revalidating; the names have no
    # hash, so deliberately NO `immutable` (see the comment in web/next.config.ts).
    location ~* ^/(images|logo)/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    location / {
        limit_req zone=site_actions burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================================
# TEMPORARY DOMAIN — szkolawspinaczkowa.pl, behind Cloudflare.
#
# The site stands here until abcwspinania.info is switched (settled 26.09.2026).
# The blocks above are for the target domain and DELIBERATELY do not know about
# this one — on the day of the switch this fragment is removed entirely (or
# replaced with a 301 to abcwspinania.info), touching nothing above.
#
# The copy is deliberately LEANER than the target domain's block: no separate
# cache rules for photos (it is the working version, not client traffic).
# Everything that protects stays: the login limit, security headers, the
# upload limit.
#
# ⚠️ The certificate file MUST be on the server BEFORE this config gets there.
# No file = `nginx -t` fails, and at the next container restart nginx does not
# start at all — together with the target domain. The certificate is a
# Cloudflare Origin Certificate (valid 15 years), not Let's Encrypt, so it
# needs no renewal.
# =============================================================================

server {
    listen 80;
    server_name szkolawspinaczkowa.pl www.szkolawspinaczkowa.pl;

    return 301 https://szkolawspinaczkowa.pl$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name szkolawspinaczkowa.pl www.szkolawspinaczkowa.pl;

    ssl_certificate /etc/nginx/certs/szkolawspinaczkowa-origin.pem;
    ssl_certificate_key /etc/nginx/certs/szkolawspinaczkowa-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # The working version must not reach Google. If it did, after the switch
    # Google would see the same content under two domains and pick which one to
    # show by itself. A header, not Disallow in robots.txt: a robots.txt ban
    # blocks reading the page, so Google would never see the `noindex` and could
    # index the bare address from incoming links.
    #
    # No `location` below has an add_header of its own — one would drop the
    # inheritance of these headers, this one included.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # HSTS without `includeSubDomains` and `preload`: this is a temporary domain
    # and we do not want to decide for two years what lives on its subdomains.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # The same values and the same reasons as in the target domain's block.
    client_max_body_size 25m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The same list of endpoints as in the target domain's block, in one
    # expression. Behind Cloudflare the limit counts real addresses thanks to
    # realip at the top of the file.
    location ~ ^/api/users/(login|first-register|forgot-password|reset-password|unlock)$ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Participant accounts — the same rules and reasons as in the target domain's block ---
    #
    # first-register CLOSED: Payload exposes it for EVERY collection with login,
    # and while the table is empty it creates an account through it bypassing
    # the access rules, confirmed and logged in at once
    # (payload/dist/auth/operations/registerFirstUser.js). Participants create
    # accounts only through /rejestracja.
    location = /api/customers/first-register {
        return 404;
    }

    # Address confirmation CLOSED in the API: the link from the email works for
    # 48 h, and the /konto/potwierdz page checks that — Payload's token does not
    # expire by itself, so the API endpoint would confirm from a link of any age.
    location ^~ /api/customers/verify/ {
        return 404;
    }

    # Endpoints accepting a secret (a password or a token from an email) — the
    # same limit as panel login.
    location ~ ^/api/customers/(login|forgot-password|reset-password|unlock)$ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Account pages, course and camp bookings, the registration form — the limit
    # counts only form submissions (see `map` at the top). A booking sends emails too.
    location ~ ^/((logowanie|rejestracja|konto)(/|$)|(kursy|obozy)/[^/]+/zapis$|obozy/rejestracja$) {
        limit_req zone=account_forms burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=site_actions burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
